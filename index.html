<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Active Learning</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f0f10; --surface: #1a1a1d; --surface2: #111;
    --border: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.14);
    --accent: #c8f060; --text: #f0ede8; --text2: #888; --text3: #444;
    --radius: 12px; --green: #4ade80; --red: #f87171;
  }
  body { background: var(--bg); color: var(--text); font-family: 'Syne', sans-serif; min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 2rem 1rem; }
  .container { width: 100%; max-width: 560px; }
  .tag { font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin-bottom: 0.5rem; }
  h1 { font-size: 2rem; font-weight: 600; margin-bottom: 0.4rem; }
  .subtitle { font-size: 13px; color: var(--text2); margin-bottom: 2rem; }

  .audio-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; margin-bottom: 1rem; }
  .tabs { display: flex; gap: 4px; margin-bottom: 1.25rem; background: var(--surface2); border-radius: 8px; padding: 4px; }
  .tab-btn { flex: 1; padding: 8px; background: transparent; border: none; border-radius: 6px; color: var(--text2); font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.06em; cursor: pointer; transition: background 0.15s, color 0.15s; }
  .tab-btn.active { background: var(--surface); color: var(--text); border: 1px solid var(--border2); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  .url-row { display: flex; gap: 8px; }
  input[type="text"] { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: 'DM Mono', monospace; font-size: 12px; padding: 10px 12px; outline: none; transition: border-color 0.2s; }
  input[type="text"]::placeholder { color: var(--text3); }
  input[type="text"]:focus { border-color: var(--accent); }
  .btn-load { padding: 10px 16px; background: transparent; border: 1px solid var(--border2); border-radius: 8px; color: var(--text); font-family: 'Syne', sans-serif; font-size: 12px; cursor: pointer; transition: border-color 0.2s, color 0.2s; white-space: nowrap; }
  .btn-load:hover { border-color: var(--accent); color: var(--accent); }
  .upload-area { border: 1.5px dashed var(--border2); border-radius: 8px; padding: 2rem; text-align: center; cursor: pointer; transition: border-color 0.2s; }
  .upload-area:hover { border-color: var(--accent); }
  .upload-area p { font-size: 13px; color: var(--text2); margin-top: 8px; }
  .upload-area span { font-size: 11px; color: var(--text3); font-family: 'DM Mono', monospace; }
  input[type="file"] { display: none; }
  .file-info { display: none; align-items: center; gap: 10px; padding: 10px 12px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; margin-top: 10px; }
  .file-info.show { display: flex; }
  .file-info-name { font-size: 13px; font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-info-size { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text2); }
  .btn-clear { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 16px; }
  .btn-clear:hover { color: var(--text); }

  #player-section { display: none; margin-top: 1.25rem; padding-top: 1.25rem; border-top: 1px solid var(--border); }
  .track-info { display: flex; align-items: center; gap: 12px; margin-bottom: 1rem; }
  .track-icon { width: 36px; height: 36px; background: rgba(200,240,96,0.1); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
  .track-name { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .track-duration { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text2); margin-top: 2px; }
  .progress-wrap { height: 3px; background: rgba(255,255,255,0.08); border-radius: 2px; margin-bottom: 0.75rem; cursor: pointer; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; width: 0%; transition: width 0.1s linear; }
  .controls { display: flex; align-items: center; justify-content: space-between; }
  .time-display { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text2); }
  .play-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: opacity 0.15s; }
  .play-btn:hover { opacity: 0.85; }
  .play-btn svg { fill: #0f0f10; }
  .volume-row { display: flex; align-items: center; gap: 6px; }
  .vol-icon { font-size: 13px; color: var(--text2); }
  input[type="range"] { width: 70px; accent-color: var(--accent); cursor: pointer; }

  .btn-generate { width: 100%; margin-top: 1rem; padding: 13px; background: var(--accent); color: #0f0f10; border: none; border-radius: 8px; font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; display: none; }
  .btn-generate:hover { opacity: 0.85; }
  .btn-generate:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-generate.show { display: block; }

  /* Quiz */
  #quiz-section { display: none; margin-top: 1.5rem; }
  .quiz-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
  .quiz-title { font-size: 1.2rem; font-weight: 600; }
  .quiz-progress { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text2); }

  .question-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; animation: fadeUp 0.3s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .q-num { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text3); letter-spacing: 0.08em; margin-bottom: 0.5rem; }
  .q-text { font-size: 15px; font-weight: 600; line-height: 1.5; margin-bottom: 1rem; }

  .options-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .option-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; font-size: 13px; color: var(--text2); cursor: pointer; transition: border-color 0.15s, color 0.15s, background 0.15s; }
  .option-item:hover:not(.disabled) { border-color: var(--border2); color: var(--text); }
  .option-item.correct { border-color: var(--green); color: var(--green); background: rgba(74,222,128,0.07); }
  .option-item.wrong { border-color: var(--red); color: var(--red); background: rgba(248,113,113,0.07); }
  .option-item.disabled { cursor: default; }
  .opt-letter { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text3); min-width: 18px; font-weight: 600; }
  .option-item.correct .opt-letter { color: var(--green); }
  .option-item.wrong .opt-letter { color: var(--red); }

  .feedback { margin-top: 1rem; padding: 10px 14px; border-radius: 8px; font-size: 13px; display: none; }
  .feedback.correct { background: rgba(74,222,128,0.1); border: 1px solid rgba(74,222,128,0.3); color: var(--green); }
  .feedback.wrong { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3); color: var(--red); }

  .btn-next { width: 100%; margin-top: 1rem; padding: 12px; background: transparent; border: 1px solid var(--border2); border-radius: 8px; color: var(--text); font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; transition: border-color 0.2s; display: none; }
  .btn-next:hover { border-color: var(--accent); color: var(--accent); }

  /* Score */
  #score-section { display: none; margin-top: 1.5rem; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 2rem; text-align: center; }
  .score-num { font-size: 3.5rem; font-weight: 600; color: var(--accent); line-height: 1; }
  .score-label { font-size: 14px; color: var(--text2); margin-top: 8px; }
  .btn-retry { margin-top: 1.5rem; padding: 12px 24px; background: var(--accent); color: #0f0f10; border: none; border-radius: 8px; font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<div class="container">
  <div class="tag">Active Learning</div>
  <h1>Quiz Generator</h1>
  <p class="subtitle">Load your audio and generate a quiz</p>

  <div class="audio-card">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('url')">Audio URL</button>
      <button class="tab-btn" onclick="switchTab('upload')">Upload File</button>
    </div>

    <div class="tab-content active" id="tab-url">
      <div class="url-row">
        <input type="text" id="audio-url" placeholder="https://drive.google.com/uc?export=download&id=..." />
        <button class="btn-load" onclick="loadFromUrl()">Load</button>
      </div>
    </div>

    <div class="tab-content" id="tab-upload">
      <div class="upload-area" onclick="document.getElementById('file-input').click()">
        <div style="font-size:28px">🎵</div>
        <p>Click to upload audio file</p>
        <span>MP3, WAV, M4A — max 50MB</span>
      </div>
      <input type="file" id="file-input" accept="audio/*" onchange="loadFromFile(this)">
      <div class="file-info" id="file-info">
        <span style="font-size:18px">🎙️</span>
        <span class="file-info-name" id="file-name"></span>
        <span class="file-info-size" id="file-size"></span>
        <button class="btn-clear" onclick="clearFile()">✕</button>
      </div>
    </div>

    <div id="player-section">
      <div class="track-info">
        <div class="track-icon">🎵</div>
        <div>
          <div class="track-name" id="track-name">audio</div>
          <div class="track-duration" id="track-dur">--:--</div>
        </div>
      </div>
      <div class="progress-wrap" id="progress-wrap">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="controls">
        <span class="time-display" id="time-current">0:00</span>
        <button class="play-btn" onclick="togglePlay()">
          <svg id="play-icon" width="14" height="16" viewBox="0 0 14 16"><path d="M0 0 L14 8 L0 16 Z"/></svg>
        </button>
        <div class="volume-row">
          <span class="vol-icon">🔊</span>
          <input type="range" id="volume" min="0" max="1" step="0.05" value="1" oninput="setVolume(this.value)">
        </div>
      </div>
    </div>
  </div>

  <button class="btn-generate" id="gen-btn" onclick="generateQuiz()">
    Generate Quiz →
  </button>

  <!-- Quiz Section -->
  <div id="quiz-section">
    <div class="quiz-header">
      <div class="quiz-title">Quiz</div>
      <div class="quiz-progress" id="quiz-progress">1 / 10</div>
    </div>
    <div class="question-card" id="question-card">
      <div class="q-num" id="q-num">QUESTION 1</div>
      <div class="q-text" id="q-text"></div>
      <ul class="options-list" id="options-list"></ul>
      <div class="feedback" id="feedback"></div>
      <button class="btn-next" id="btn-next" onclick="nextQuestion()">Next →</button>
    </div>
  </div>

  <!-- Score Section -->
  <div id="score-section">
    <div class="score-num" id="score-num">0/10</div>
    <div class="score-label">Quiz Complete!</div>
    <button class="btn-retry" onclick="retryQuiz()">Try Again</button>
  </div>
</div>

<audio id="audio-el"></audio>

<script>
const audio = document.getElementById('audio-el');
const progressFill = document.getElementById('progress-fill');
const timeCurrent = document.getElementById('time-current');
let currentAudioUrl = '';
let questions = [];
let currentQ = 0;
let score = 0;
let answered = false;

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', (i===0&&tab==='url')||(i===1&&tab==='upload')));
  document.getElementById('tab-url').classList.toggle('active', tab==='url');
  document.getElementById('tab-upload').classList.toggle('active', tab==='upload');
}

function loadFromUrl() {
  const url = document.getElementById('audio-url').value.trim();
  if (!url) return;
  currentAudioUrl = url;
  initPlayer(url, url.split('/').pop() || 'audio.mp3');
}

function loadFromFile(input) {
  const file = input.files[0];
  if (!file) return;
  document.getElementById('file-name').textContent = file.name;
  document.getElementById('file-size').textContent = (file.size/(1024*1024)).toFixed(2)+' MB';
  document.getElementById('file-info').classList.add('show');
  const reader = new FileReader();
  reader.onload = (e) => {
    currentAudioUrl = e.target.result;
    initPlayer(e.target.result, file.name);
  };
  reader.readAsDataURL(file);
}

function clearFile() {
  document.getElementById('file-input').value = '';
  document.getElementById('file-info').classList.remove('show');
  document.getElementById('player-section').style.display = 'none';
  document.getElementById('gen-btn').classList.remove('show');
  currentAudioUrl = '';
}

function initPlayer(src, name) {
  audio.src = src;
  audio.load();
  document.getElementById('track-name').textContent = name;
  document.getElementById('player-section').style.display = 'block';
  document.getElementById('gen-btn').classList.add('show');
  audio.addEventListener('loadedmetadata', () => {
    document.getElementById('track-dur').textContent = formatTime(audio.duration);
  });
}

function togglePlay() {
  const icon = document.getElementById('play-icon');
  if (audio.paused) {
    audio.play();
    icon.innerHTML = '<rect x="1" y="0" width="4" height="16" rx="1"/><rect x="9" y="0" width="4" height="16" rx="1"/>';
  } else {
    audio.pause();
    icon.innerHTML = '<path d="M0 0 L14 8 L0 16 Z"/>';
  }
}

audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  progressFill.style.width = (audio.currentTime/audio.duration*100)+'%';
  timeCurrent.textContent = formatTime(audio.currentTime);
});

audio.addEventListener('ended', () => {
  document.getElementById('play-icon').innerHTML = '<path d="M0 0 L14 8 L0 16 Z"/>';
  progressFill.style.width = '0%';
});

document.getElementById('progress-wrap').addEventListener('click', (e) => {
  if (!audio.duration) return;
  const rect = e.currentTarget.getBoundingClientRect();
  audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
});

function setVolume(v) { audio.volume = v; }

function formatTime(s) {
  return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
}

// Parse quiz text from n8n
function parseQuiz(text) {
  const qs = [];
  const blocks = text.split(/\n\n+/).filter(b => b.trim());
  let current = null;
  for (const block of blocks) {
    const lines = block.split('\n').filter(l => l.trim());
    for (const line of lines) {
      const qMatch = line.match(/^\d+\.\s+(.+)/);
      const optMatch = line.match(/^([A-D])\)\s+(.+)/);
      const ansMatch = line.match(/\*\*Answer:\s*([A-D])\*\*/);
      if (qMatch) {
        if (current) qs.push(current);
        current = { q: qMatch[1], opts: [], ans: '' };
      } else if (optMatch && current) {
        current.opts.push({ letter: optMatch[1], text: optMatch[2] });
      } else if (ansMatch && current) {
        current.ans = ansMatch[1];
      }
    }
  }
  if (current) qs.push(current);
  return qs;
}

async function generateQuiz() {
  if (!currentAudioUrl) { alert('Please load an audio file first!'); return; }
  const btn = document.getElementById('gen-btn');
  btn.textContent = 'Generating...';
  btn.disabled = true;
  document.getElementById('quiz-section').style.display = 'none';
  document.getElementById('score-section').style.display = 'none';

  try {
    const response = await fetch('https://ffmpegvid.agnarai.se/webhook/a3c77238-918b-4237-a624-85b24e2f5684', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ audio_url: currentAudioUrl })
    });
    const data = await response.json();
    const text = data[0]?.output || data?.output || '';
    questions = parseQuiz(text);
    if (questions.length === 0) { alert('Could not parse quiz. Try again.'); return; }
    currentQ = 0; score = 0;
    showQuestion();
    document.getElementById('quiz-section').style.display = 'block';
  } catch (err) {
    alert('Error: ' + err.message);
  }

  btn.textContent = 'Generate Quiz →';
  btn.disabled = false;
}

function showQuestion() {
  const q = questions[currentQ];
  answered = false;
  document.getElementById('q-num').textContent = 'QUESTION ' + (currentQ + 1);
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('quiz-progress').textContent = (currentQ+1) + ' / ' + questions.length;
  document.getElementById('feedback').style.display = 'none';
  document.getElementById('btn-next').style.display = 'none';

  const list = document.getElementById('options-list');
  list.innerHTML = '';
  q.opts.forEach(opt => {
    const li = document.createElement('li');
    li.className = 'option-item';
    li.innerHTML = `<span class="opt-letter">${opt.letter}</span><span>${opt.text}</span>`;
    li.onclick = () => selectAnswer(opt.letter, li);
    list.appendChild(li);
  });

  // re-animate
  const card = document.getElementById('question-card');
  card.style.animation = 'none';
  card.offsetHeight;
  card.style.animation = 'fadeUp 0.3s ease';
}

function selectAnswer(letter, el) {
  if (answered) return;
  answered = true;
  const q = questions[currentQ];
  const isCorrect = letter === q.ans;
  if (isCorrect) score++;

  document.querySelectorAll('.option-item').forEach(item => {
    item.classList.add('disabled');
    const l = item.querySelector('.opt-letter').textContent;
    if (l === q.ans) item.classList.add('correct');
    else if (l === letter && !isCorrect) item.classList.add('wrong');
  });

  const fb = document.getElementById('feedback');
  fb.className = 'feedback ' + (isCorrect ? 'correct' : 'wrong');
  fb.textContent = isCorrect ? '✓ Correct!' : `✗ Wrong! Correct answer: ${q.ans}`;
  fb.style.display = 'block';

  const btnNext = document.getElementById('btn-next');
  btnNext.style.display = 'block';
  btnNext.textContent = currentQ < questions.length - 1 ? 'Next →' : 'See Results';
}

function nextQuestion() {
  currentQ++;
  if (currentQ < questions.length) {
    showQuestion();
  } else {
    document.getElementById('quiz-section').style.display = 'none';
    document.getElementById('score-num').textContent = score + '/' + questions.length;
    document.getElementById('score-section').style.display = 'block';
  }
}

function retryQuiz() {
  document.getElementById('score-section').style.display = 'none';
  currentQ = 0; score = 0;
  showQuestion();
  document.getElementById('quiz-section').style.display = 'block';
}
</script>
</body>
</html>
